<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>DRIFT UI-Demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f1c; overflow: hidden; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; inset: 0; }
    #game { position: absolute; inset: 0; image-rendering: pixelated; display: block; }
  </style>
</head>
<body>
<div id="app"><canvas id="game"></canvas></div>
<script type="module">
// Isolated UI test bench with a fake game object. Keys: 1 dialog, 2 Ja/Nein, 3 damage, 4 heal, 5 area name,
// 6 game over, 7 title, 8 +rupees, 9 toast, 0 +heart container. URL: ?screen=title|pause|dialog|choice|gameover|area|low
import { createInput } from '../engine/input.js';
import { createCamera } from '../engine/camera.js';
import { createUI } from './index.js';

const q = new URLSearchParams(location.search);
const root = document.getElementById('app');
const cv = document.getElementById('game');
const g2 = cv.getContext('2d');
const input = createInput(window);
const camera = createCamera();
let assets = { icons: {}, palette: {} };
if (q.has('art')) { try { assets = (await import('../art/index.js')).buildAssets(); } catch (e) { console.warn('art failed', e); } }
const sfxLog = [];
const sfx = { play: (n) => sfxLog.push(n), music() {}, setVolume(v) { sfx.vol = v; }, unlock() {}, vol: 1 };
const renderer = { tiltShift: true };
const ui = createUI({ root, input, assets, sfx, camera });

const player = { x: 0, y: 0, hp: 9, maxHp: 12, rupees: 123, bombs: 4, keys: 1, item: 'bomb', inventory: ['sword', 'shield', 'bomb', 'boomerang', 'lamp', 'map'] };
const game = {
  state: q.get('screen') === 'title' ? 'title' : 'play', player, world: { pxW: 640, pxH: 480 }, areaName: null,
  start() { game.state = 'play'; game.areaName = 'Weiler Morgentau'; },
  retry() { player.hp = player.maxHp; game.state = 'play'; },
  restart() { location.reload(); },
  update(dt) { player.x += input.axis.x * 60 * dt; player.y += input.axis.y * 60 * dt; },
};
ui.bind(game);
window.__drift = { ui, game, input, camera, renderer, sfx, sfxLog };

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
  cv.width = w; cv.height = h; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  camera.resize(w, h); ui.resize(w, h, dpr);
}
addEventListener('resize', resize); resize();

// fake diorama background
function drawWorld(t) {
  const s = camera.scale, W = cv.width, H = cv.height;
  g2.fillStyle = '#0d0f1c'; g2.fillRect(0, 0, W, H);
  const T = 16 * s;
  const ox = W / 2 - player.x * s, oy = H / 2 - player.y * s;
  for (let y = -2; y < H / T + 2; y++) for (let x = -2; x < W / T + 2; x++) {
    const wx = Math.floor(x - ox / T), wy = Math.floor(y - oy / T);
    const water = (wx > 6 && wx < 10 && wy > 1 && wy < 5);
    g2.fillStyle = water ? ((wx + wy) % 2 ? '#2878c0' : '#58b0e0') : ((wx * 7 + wy * 13) % 5 === 0 ? '#286840' : (wx + wy) % 2 ? '#48a050' : '#50a858');
    g2.fillRect(Math.floor(x * T + (ox % T)), Math.floor(y * T + (oy % T)), Math.ceil(T), Math.ceil(T));
  }
  g2.fillStyle = '#58b828'; g2.fillRect(W / 2 - 6 * s, H / 2 - 20 * s, 12 * s, 20 * s);
  g2.fillStyle = '#e89868'; g2.fillRect(W / 2 - 5 * s, H / 2 - 26 * s, 10 * s, 8 * s);
}

const keys = {
  Digit1: () => ui.dialog(['Willkommen in DRIFT! Dies ist ein längerer Text, damit der Seitenumbruch und der Schreibmaschinen-Effekt getestet werden.', 'Grüße aus dem Dorf. Äpfel, Öl, Übermut und Straße.']).then((r) => ui.toast('Dialog: ' + r)),
  Digit2: () => ui.dialog({ text: 'Möchtest du die Truhe öffnen?', speaker: 'Ältester', choices: ['Ja', 'Nein'] }).then((r) => ui.toast(r === 0 ? 'Ja gewählt' : 'Nein gewählt')),
  Digit3: () => { player.hp = Math.max(0, player.hp - 1); if (player.hp === 0) game.state = 'gameover'; },
  Digit4: () => { player.hp = Math.min(player.maxHp, player.hp + 2); },
  Digit5: () => { game.areaName = ['Weiler Morgentau', 'Flüsterwald', 'Höhle der Stille'][Math.floor(Math.random() * 3)] + ' ' + Math.floor(Math.random() * 9); },
  Digit6: () => ui.showGameOver((c) => { ui.toast('Gewählt: ' + c); player.hp = player.maxHp; game.state = 'play'; }),
  Digit7: () => ui.showTitle(() => ui.toast('Start!')),
  Digit8: () => { player.rupees += 50; },
  Digit9: () => ui.toast('Schlüssel gefunden!'),
  Digit0: () => { player.maxHp = Math.min(40, player.maxHp + 2); },
};
addEventListener('keydown', (e) => keys[e.code]?.());

const scr = q.get('screen');
if (scr === 'dialog') keys.Digit1();
if (scr === 'choice') keys.Digit2();
if (scr === 'gameover') keys.Digit6();
if (scr === 'area') game.areaName = 'Flüsterwald';
if (scr === 'low') { player.hp = 2; }
if (scr === 'pause') setTimeout(() => ui.openPause(), 50);

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  while (acc >= 1 / 60) {
    input.poll();
    if (input.pressed('zoomIn')) camera.zoom(1);
    if (input.pressed('zoomOut')) camera.zoom(-1);
    if (!ui.blocking) game.update(1 / 60);
    ui.update(1 / 60);
    camera.update(1 / 60, null);
    acc -= 1 / 60;
  }
  drawWorld(now / 1000);
  ui.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
