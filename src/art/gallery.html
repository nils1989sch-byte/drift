<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DRIFT Art Gallery</title>
<style>
  :root { --bg: #1c1a2c; --card: #282640; --fg: #d8c8a0; --dim: #8a84a8; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; }
  header { padding: 10px 16px; position: sticky; top: 0; background: #14121f; z-index: 2; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header b { font-size: 15px; letter-spacing: 1px; }
  header span { color: var(--dim); }
  h2 { margin: 18px 16px 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: #f8e878; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px; }
  .card { background: var(--card); border-radius: 4px; padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
  .card .n { color: var(--fg); white-space: nowrap; }
  .card .m { color: var(--dim); font-size: 10px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .chk { background-color: #48a050; }
  .bg-dark { background-color: #303858; }
  #scene { padding: 0 16px 16px; }
  #scene canvas { border: 1px solid #000; }
  .bad { color: #f08060; }
</style>
</head>
<body>
<header><b>DRIFT · Art Gallery</b><span id="info">building…</span>
  <span>Parameter: ?only=hero_,tree &nbsp; ?scales=1,3,4 &nbsp; ?bg=grass|dark|none &nbsp; ?scene=0 &nbsp; ?anim=0</span></header>
<div id="root"></div>
<script type="importmap">
  { "imports": { "three": "../../vendor/three/three.module.min.js", "three/addons/": "../../vendor/three/addons/" } }
</script>
<script type="module" src="./gallery.js"></script>
</body>
</html>
