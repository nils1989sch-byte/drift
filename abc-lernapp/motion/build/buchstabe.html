Q92 66 84 76Q76 66 62 70Z\" fill=\"url(#iy-f7e5a59f)\"/><ellipse cx=\"100\" cy=\"126\" rx=\"28\" ry=\"20\" fill=\"url(#iy-fc49a7c)\"/><ellipse cx=\"80\" cy=\"94\" rx=\"7\" ry=\"8.6\" fill=\"url(#iy-eye)\"/><circle cx=\"82.4\" cy=\"91\" r=\"2.9\" fill=\"#fff\"/><circle cx=\"77.7\" cy=\"97.3\" r=\"1.3\" fill=\"#fff\" opacity=\".85\"/><ellipse cx=\"120\" cy=\"94\" rx=\"7\" ry=\"8.6\" fill=\"url(#iy-eye)\"/><circle cx=\"122.4\" cy=\"91\" r=\"2.9\" fill=\"#fff\"/><circle cx=\"117.7\" cy=\"97.3\" r=\"1.3\" fill=\"#fff\" opacity=\".85\"/><ellipse cx=\"90\" cy=\"122\" rx=\"4\" ry=\"3\" fill=\"#2b2158\" opacity=\".6\"/><ellipse cx=\"110\" cy=\"122\" rx=\"4\" ry=\"3\" fill=\"#2b2158\" opacity=\".6\"/><path d=\"M93 132Q100 138.7 107 132\" fill=\"none\" stroke=\"#2b2158\" stroke-width=\"3\" stroke-linecap=\"round\"/><ellipse cx=\"68\" cy=\"112\" rx=\"11\" ry=\"7\" fill=\"url(#iy-bl)\"/><ellipse cx=\"132\" cy=\"112\" rx=\"11\" ry=\"7\" fill=\"url(#iy-bl)\"/><ellipse cx=\"84\" cy=\"50\" rx=\"14\" ry=\"5\" transform=\"rotate(-15 84 50)\" fill=\"url(#iy-hl)\" opacity=\"0.4\"/></svg>"},"Z":{"word":"Zebra","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Zebra\"><defs><radialGradient id=\"iz-sh\"><stop offset=\"0\" stop-color=\"#3b2a8c\" stop-opacity=\".32\"/><stop offset=\".6\" stop-color=\"#3b2a8c\" stop-opacity=\".12\"/><stop offset=\"1\" stop-color=\"#3b2a8c\" stop-opacity=\"0\"/></radialGradient><radialGradient id=\"iz-ffbfaff\" cx=\"0.36\" cy=\"0.28\" r=\"0.85\"><stop offset=\"0\" stop-color=\"#fdfcff\"/><stop offset=\".55\" stop-color=\"#fbfaff\"/><stop offset=\"1\" stop-color=\"#d8d5ea\"/></radialGradient><radialGradient id=\"iz-fc9c1e4mz\" cx=\"0.36\" cy=\"0.28\" r=\"0.85\"><stop offset=\"0\" stop-color=\"#e1ddf0\"/><stop offset=\".55\" stop-color=\"#c9c1e4\"/><stop offset=\"1\" stop-color=\"#9e94ca\"/></radialGradient><linearGradient id=\"iz-eye\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\".45\" stop-color=\"#2b2158\ b2158\" opacity=\".75\"/><path d=\"M92 151Q100 158.6 108 151\" fill=\"none\" stroke=\"#2b2158\" stroke-width=\"3\" stroke-linecap=\"round\"/><ellipse cx=\"80\" cy=\"92\" rx=\"7\" ry=\"8.6\" fill=\"url(#iz-eye)\"/><circle cx=\"82.4\" cy=\"89\" r=\"2.9\" fill=\"#fff\"/><circle cx=\"77.7\" cy=\"95.3\" r=\"1.3\" fill=\"#fff\" opacity=\".85\"/><ellipse cx=\"120\" cy=\"92\" rx=\"7\" ry=\"8.6\" fill=\"url(#iz-eye)\"/><circle cx=\"122.4\" cy=\"89\" r=\"2.9\" fill=\"#fff\"/><circle cx=\"117.7\" cy=\"95.3\" r=\"1.3\" fill=\"#fff\" opacity=\".85\"/><ellipse cx=\"70\" cy=\"110\" rx=\"9.9\" ry=\"6.3\" fill=\"url(#iz-bl)\"/><ellipse cx=\"130\" cy=\"110\" rx=\"9.9\" ry=\"6.3\" fill=\"url(#iz-bl)\"/><ellipse cx=\"86\" cy=\"52\" rx=\"12\" ry=\"6\" transform=\"rotate(-20 86 52)\" fill=\"url(#iz-hl)\" opacity=\"0.7\"/></g></svg>"}};
  const hf = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
  const qs = /[?&]letter=([A-Za-z])/.exec(location.search);
  let L = String((qs && qs[1]) || hf.letter || 'M').trim().charAt(0).toUpperCase();
  if (!WORDS[L]) L = 'M';
  const showLower = hf.lower !== false && hf.lower !== 'false';
  const entry = WORDS[L];

  const up = document.getElementById('up'), lo = document.getElementById('lo');
  up.textContent = L; lo.textContent = L.toLowerCase();
  if (!showLower) lo.style.display = 'none';
  const ill = document.getElementById('ill'); ill.innerHTML = entry.svg;
  const word = document.getElementById('word');
  const first = entry.word.charAt(0), rest = entry.word.slice(1);
  word.innerHTML = `<span class="w L">${L}</span><span class="w wie">wie</span><span class="w"><span class="first">${first}</span>${rest}</span>`;
  const wparts = [...word.querySelectorAll('.w')];
  const firstEl = word.querySelector('.first');

  // sparkles around the illustration
  const tpl = document.getElementById('sparkle').innerHTML;
  const SPK = [{x:560,y:70,s:46,t:1.55},{x:965,y:120,s:38,t:1.7},{x:930,y:420,s:30,t:1.85},{x:120,y:90,s:34,t:2.0}];
  const spkHost = document.getElementById('spk');
  const spks = SPK.map(d => { const el = document.createElement('div'); el.className = 'spk';
    el.style.cssText += `left:${d.x - d.s/2}px;top:${d.y - d.s/2}px;width:${d.s}px;height:${d.s}px`; el.innerHTML = tpl; spkHost.appendChild(el); return el; });

  const card = document.getElementById('card'), glow = document.getElementById('glow');
  const clouds = ['c1','c2'].map(id => document.getElementById(id));
  const SAY = 2.0;   // moment the voice says the first letter

  function render(t) {
    clouds.forEach((c, i) => c.style.transform = `translateX(${(16 * Math.sin(2 * Math.PI * t / 7 + i * 2) - 16 * Math.sin(i * 2)).toFixed(2)}px)`);

    // sheet open: translateY(40) scale(.92) -> rest, 520ms spring-soft; opacity 240ms
    const cp = E.springSoft(prog(t, 0, 0.52));
    card.style.opacity = clamp(t / 0.24);
    card.style.transform = `translateY(${(40 * (1 - cp)).toFixed(2)}px) scale(${(0.92 + 0.08 * cp).toFixed(4)})`;

    // glyph: scale(.4) rotate(-8) -> 1.08/2deg -> rest (playful spring ~650ms) + squash pulse when spoken
    const g = (el, t0, k) => { const v = t < t0 ? 0 : K.springAt(t - t0, 260, 14);
      const pulse = bump(t, SAY + k * 0.05, 0.34);
      el.style.opacity = t < t0 ? 0 : clamp((t - t0) / 0.12);
      el.style.transform = `scale(${(0.4 + 0.6 * v + 0.05 * pulse).toFixed(4)},${(0.4 + 0.6 * v - 0.03 * pulse).toFixed(4)}) rotate(${(-8 * (1 - v)).toFixed(2)}deg)`; };
    g(up, 0.3, 0); g(lo, 0.45, 1);

    // illustration glides in (150ms after the glyph), settles with a soft squash, then floats
    const it0 = 0.6, iv = t < it0 ? 0 : K.springAt(t - it0, 180, 20);
    const ivPrev = t - 1/60 < it0 ? 0 : K.springAt(t - 1/60 - it0, 180, 20);
    const vel = (iv - ivPrev) * 60;
    const st = clamp(vel * 0.03, -0.05, 0.08);
    const flt = E.inOut(prog(t, 1.4, 0.6)) * Math.sin(2 * Math.PI * (t - 1.4) / 2.4);
    ill.style.opacity = t < it0 ? 0 : clamp((t - it0) / 0.18);
    ill.style.transform = `translate(${(150 * (1 - iv)).toFixed(2)}px,${(30 * (1 - iv) - 7 * flt).toFixed(2)}px) rotate(${(8 * (1 - iv) + 1.5 * flt).toFixed(2)}deg) scale(${(0.8 + 0.2 * iv + st).toFixed(4)},${(0.8 + 0.2 * iv - st * .6).toFixed(4)})`;
    const gv = E.out(prog(t, 0.55, 0.8));
    glow.style.opacity = gv; glow.style.transform = `scale(${(0.7 + 0.3 * gv + 0.03 * flt).toFixed(4)})`;

    // "M wie Maus" rises in, word by word
    wparts.forEach((el, i) => { const t0 = 1.2 + i * 0.14; const v = t < t0 ? 0 : K.springAt(t - t0, 180, 20);
      el.style.opacity = t < t0 ? 0 : clamp((t - t0) / 0.2);
      el.style.transform = `translateY(${(26 * (1 - v)).toFixed(2)}px) scale(${(0.9 + 0.1 * v).toFixed(4)})`; });
    // coloured first letter bounces when spoken
    const b = bump(t, SAY + 0.12, 0.3);
    firstEl.style.transform = `translateY(${(-10 * b).toFixed(2)}px) scale(${(1 + 0.08 * b).toFixed(3)})`;

    spks.forEach((el, i) => { const d = SPK[i]; const pin = t < d.t ? 0 : K.springAt(t - d.t, 220, 14);
      const tw = Math.sin(2 * Math.PI * (t - d.t) / 2.8 + i);
      el.style.opacity = t < d.t ? 0 : clamp((t - d.t) / .15) * (0.8 + 0.2 * tw);
      el.style.transform = `scale(${(pin * (0.85 + 0.15 * tw)).toFixed(4)}) rotate(${(20 * (1 - pin) + 8 * tw).toFixed(2)}deg)`; });
  }
  K.bind('buchstabe', DUR, render);
})();
