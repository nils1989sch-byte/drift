<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180, height=820">
<title>Feier – ABC mit Bruno</title>
<script src="../assets/gsap.min.js"></script>
<script src="../assets/kit.js"></script>
<style>
{{COMMON_CSS}}
#rays{position:absolute;left:-210px;top:-500px;width:1600px;height:1600px;will-change:transform;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.26) 0deg 7deg,rgba(255,255,255,0) 7deg 22.5deg);
  -webkit-mask:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.6) 35%,transparent 72%);
  mask:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.6) 35%,transparent 72%)}
#glow{position:absolute;left:290px;top:0;width:600px;height:560px;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0))}
.cloud{position:absolute;will-change:transform}
.cloud>svg{display:block;width:100%;height:100%}
#text{position:absolute;left:0;right:0;top:494px;text-align:center;font-size:84px;color:#2b2158;line-height:1;
  text-shadow:0 0 18px #fff,0 0 34px rgba(255,255,255,.9),0 4px 0 rgba(255,255,255,.8)}
#text .sp{display:inline-block;width:24px}
#stars{position:absolute;left:0;right:0;top:606px;display:flex;justify-content:center;gap:18px}
.star{width:76px;height:76px;filter:drop-shadow(0 8px 10px rgba(224,122,0,.35))}
.star>svg{display:block;width:100%;height:100%}
.burst,.conf{position:absolute;left:0;top:0;will-change:transform}
.burst>svg{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="root" data-composition-id="feier" data-start="0" data-duration="3" data-width="1180" data-height="820">
  <div class="sky"></div><div class="dots"></div><div class="dots2"></div>
  <div id="rays"></div><div id="glow"></div>
  <div class="cloud" id="c1" style="left:-30px;top:250px;width:230px;height:129px">{{SVG:scenery/cloud.svg}}</div>
  <div class="cloud" id="c2" style="left:880px;top:60px;width:200px;height:112px">{{SVG:scenery/cloud-small.svg}}</div>
  <div class="hills">{{SVG:scenery/hills.svg}}</div>
  <div class="cloud" id="c3" style="left:960px;top:560px;width:260px;height:146px">{{SVG:scenery/cloud.svg}}</div>
  <div id="bursts"></div>
  <div id="confetti"></div>
  <div class="bwrap" id="bruno" style="left:410px;top:112px;width:360px;height:360px">{{SVG:bruno.svg}}</div>
  <div id="text"></div>
  <div id="stars"></div>
</div>
<template id="star">{{SVG:scenery/star.svg}}</template>
<script>
(function(){
  const {clamp,lerp,prog,E,spr,bump,breath,blink,rng} = K;
  const DUR = 3;
  const starSvg = document.getElementById('star').innerHTML;

  // Text letters
  const text = document.getElementById('text');
  'Super gemacht!'.split('').forEach(c => { const s = document.createElement('span');
    if (c === ' ') s.className = 'sp'; else { s.className = 'ch'; s.textContent = c; } text.appendChild(s); });
  const chars = [...text.querySelectorAll('.ch')];

  // Five reward stars
  const starsHost = document.getElementById('stars');
  const stars = [0,1,2,3,4].map(i => { const d = document.createElement('div'); d.className = 'star'; d.innerHTML = starSvg; starsHost.appendChild(d); return d; });

  // Star bursts behind Bruno
  const R = rng(7);
  const burstHost = document.getElementById('bursts');
  const BURSTS = [];
  [[0.62, 10, 1], [1.62, 8, 0.8]].forEach(([t0, n, k]) => {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + R() * 0.4 - Math.PI / 2, dist = (230 + R() * 110) * k, size = 26 + R() * 22;
      const el = document.createElement('div'); el.className = 'burst';
      el.style.width = el.style.height = size + 'px'; el.innerHTML = starSvg; burstHost.appendChild(el);
      BURSTS.push({ el, t0: t0 + R() * 0.06, a, dist, size, rot: (R() - .5) * 300 });
    }
  });

  // Confetti (spec: 40 pieces, angles -160..-20, v 500-900 px/s, g 1400 px/s², flip, life 1.6-2.2s)
  const COLORS = ['#ff6f91','#ff9a3c','#ffc928','#3ccf8e','#4fb3f6','#9b7cf7'];
  const confHost = document.getElementById('confetti');
  const CONF = [];
  function wave(t0, n, x0, y0, lifeMin, lifeMax, seed) {
    const r = rng(seed);
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div'); el.className = 'conf';
      const dot = r() < 0.35, w = dot ? 16 : 14 + r() * 4, h = dot ? 16 : 22 + r() * 4;
      el.style.cssText += `width:${w}px;height:${h}px;border-radius:${dot ? '50%' : '5px'};background:${COLORS[i % COLORS.length]};` +
        `box-shadow:inset 0 -3px 0 rgba(43,33,88,.12),inset 0 2px 0 rgba(255,255,255,.35)`;
      confHost.appendChild(el);
      const ang = (-160 + r() * 140) * Math.PI / 180, v = 500 + r() * 400;
      CONF.push({ el, t0: t0 + r() * 0.16, x0: x0 + (r() - .5) * 240, y0: y0 + (r() - .5) * 60, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
        life: lifeMin + r() * (lifeMax - lifeMin), rz: r() * 360, vrz: (r() - .5) * 540, flip: 1 + r(), w, h });
    }
  }
  wave(0.5, 40, 590, 230, 1.6, 2.2, 11);
  wave(1.5, 18, 590, 230, 1.2, 1.4, 23);

  const bw = document.getElementById('bruno');
  const B = K.Bruno(bw);
  const rays = document.getElementById('rays');
  const clouds = ['c1','c2','c3'].map(id => document.getElementById(id));

  // One cheer jump per DESIGN.md: squash 120ms, up 280ms, down 260ms, landing squash springs back.
  const H = 74;
  function jump(t, js) {
    const u = t - js;
    if (u < 0) return null;
    if (u < 0.12) { const p = E.in(u / 0.12); return { y: 0, sx: 1 + 0.08 * p, sy: 1 - 0.08 * p, air: 0 }; }
    if (u < 0.40) { const p = (u - 0.12) / 0.28; const e = E.out(p);
      const st = 0.09 * (1 - p); return { y: -H * e, sx: 1 - st * .6, sy: 1 + st, air: e }; }
    if (u < 0.66) { const p = (u - 0.40) / 0.26; const e = E.inQuad(p);
      const st = 0.06 * p; return { y: -H * (1 - e), sx: 1 - st * .6, sy: 1 + st, air: 1 - e }; }
    const w = u - 0.66; const sq = 1 - K.springAt(w, 260, 14);     // 1 -> 0 with overshoot
    return { y: 0, sx: 1 + 0.1 * sq, sy: 1 - 0.1 * sq, air: 0, land: w };
  }
  const J = [0.22, 1.22];

  function render(t) {
    rays.style.transform = `rotate(${(t * 9).toFixed(3)}deg)`;
    clouds.forEach((c, i) => c.style.transform = `translateX(${(14 * Math.sin(2 * Math.PI * t / 6 + i * 2) - 14 * Math.sin(i * 2)).toFixed(2)}px)`);

    // Bruno
    // second jump takes over once it starts
    const cur = t >= J[1] ? jump(t, J[1]) : (jump(t, J[0]) || { y: 0, sx: 1, sy: 1, air: 0 });
    bw.style.transform = `translateY(${cur.y.toFixed(2)}px) scale(${cur.sx.toFixed(4)},${cur.sy.toFixed(4)})`;
    const cheer = t >= J[0] + 0.12;
    const armUp = cheer ? spr(t, J[0] + 0.12, [220, 13, 1]) : 0;
    // arms lag a little on each landing
    let lag = 0; J.forEach(js => { const w = t - (js + 0.66); if (w > 0) lag += 12 * Math.exp(-7 * w) * Math.sin(2 * Math.PI * w / 0.36); });
    B.set({
      mood: cheer ? 'cheer' : 'happy',
      armL: 125 * armUp - lag, armR: -125 * armUp + lag,
      breath: breath(Math.max(0, t - 2.2), 3.2),
      headY: -3 * armUp, headRot: 0,
      lid: blink(t, []),
      shadow: 1 - 0.55 * cur.air,
      earL: K.earWiggle(t, J[0] + 0.66), earR: K.earWiggle(t, J[0] + 0.72),
    });
    // twinkling sparkles (part of cheer mood)
    B.sparkleKids.forEach((el, i) => {
      const t0 = J[0] + 0.12 + i * 0.08; const u = t - t0;
      let s = 0, r = 0;
      if (u > 0) { const p = clamp(u / 0.45); s = p < .6 ? lerp(.6, 1.2, E.out(p / .6)) : lerp(1.2, 1, E.inOut((p - .6) / .4));
        r = 45 * E.out(p); s *= 1 - 0.15 * (u > .45 ? (1 - Math.cos(2 * Math.PI * (u - .45) / 1.4)) / 2 : 0); }
      el.style.transform = `scale(${s.toFixed(3)}) rotate(${r.toFixed(2)}deg)`;
    });

    // star bursts
    BURSTS.forEach(b => { const u = t - b.t0;
      if (u <= 0 || u > 1.1) { b.el.style.opacity = 0; return; }
      const p = u / 1.1, e = E.out(p);
      const cx = 590 + Math.cos(b.a) * b.dist * e, cy = 290 + Math.sin(b.a) * b.dist * e * 0.8 + 60 * p * p;
      const sc = p < .2 ? E.out(p / .2) : 1 - 0.4 * (p - .2) / .8;
      b.el.style.opacity = p < .6 ? 1 : 1 - (p - .6) / .4;
      b.el.style.transform = `translate(${(cx - b.size / 2).toFixed(1)}px,${(cy - b.size / 2).toFixed(1)}px) rotate(${(b.rot * e).toFixed(1)}deg) scale(${sc.toFixed(3)})`;
    });

    // confetti physics
    CONF.forEach(c => { const u = t - c.t0;
      if (u <= 0 || u > c.life) { c.el.style.opacity = 0; return; }
      const drag = Math.exp(-0.6 * u);
      const x = c.x0 + c.vx * u * drag, y = c.y0 + c.vy * u * drag + 0.5 * 1400 * u * u * 0.55;
      c.el.style.opacity = u > c.life - 0.3 ? (c.life - u) / 0.3 : 1;
      c.el.style.transform = `translate(${(x - c.w / 2).toFixed(1)}px,${(y - c.h / 2).toFixed(1)}px) perspective(400px) rotateZ(${(c.rz + c.vrz * u).toFixed(1)}deg) rotateX(${(720 * c.flip * u / c.life).toFixed(1)}deg)`;
    });

    // "Super gemacht!" letters pop in
    chars.forEach((el, i) => { const t0 = 0.78 + i * 0.04; const u = t - t0;
      if (u <= 0) { el.style.opacity = 0; el.style.transform = 'scale(0)'; return; }
      const v = K.springAt(u, 240, 14);
      el.style.opacity = clamp(u / 0.12);
      // little wave of joy when Bruno lands the second jump
      const hop = -10 * bump(t, J[1] + 0.66 + i * 0.03, 0.32);
      el.style.transform = `translateY(${(36 * (1 - v) + hop).toFixed(2)}px) scale(${(0.3 + 0.7 * v).toFixed(4)}) rotate(${(-8 * (1 - v)).toFixed(2)}deg)`;
    });

    // reward stars drop in (translateY(-60) scale 0 -> rest, 500ms spring, 120ms stagger), alternately tilted
    stars.forEach((el, i) => { const t0 = 1.3 + i * 0.12; const v = t < t0 ? 0 : K.springAt(t - t0, 260, 14);
      const tilt = (i % 2 ? 8 : -8);
      el.style.opacity = t < t0 ? 0 : clamp((t - t0) / 0.1);
      el.style.transform = `translateY(${(-60 * (1 - v)).toFixed(2)}px) scale(${v.toFixed(4)}) rotate(${(tilt * v).toFixed(2)}deg)`;
    });
  }
  K.bind('feier', DUR, render);
})();
</script>
</body>
</html>
